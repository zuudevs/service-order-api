version: "3.8"

services:
  service-order-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - INTERNAL_API_TOKEN_HASH=${INTERNAL_API_TOKEN_HASH}
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
