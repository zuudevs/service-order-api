name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ env.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: tag_name
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          release_name: Release ${{ env.VERSION }}
          body: |
            Changes in this Release:
            - See commit history for detailed changes

            Installation:
            ```bash
            # Download and extract the binary for your platform
            # Run: ./service-order-api
            ```

            Docker:
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            docker run -p 8080:8080 ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ```
          draft: false
          prerelease: false

  build-release-artifacts:
    runs-on: ${{ matrix.os }}
    needs: create-release

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: service-order-api-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            output: service-order-api-linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: service-order-api-macos-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: service-order-api-macos-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: service-order-api-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.8"

      - name: Build binary
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X main.Version=${{ needs.create-release.outputs.version }} -X main.BuildTime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -o ${{ matrix.output }} \
            ./cmd/server
        shell: bash

      - name: Create checksums
        run: |
          sha256sum ${{ matrix.output }} > ${{ matrix.output }}.sha256
        shell: bash

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ matrix.output }}
          asset_name: ${{ matrix.output }}
          asset_content_type: application/octet-stream

      - name: Upload Checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ matrix.output }}.sha256
          asset_name: ${{ matrix.output }}.sha256
          asset_content_type: text/plain

  publish-docker:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.create-release.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
